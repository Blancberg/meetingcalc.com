<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Embeddable MeetingCalc widget — the meeting cost calculator for embedding on any site.">
  <title>MeetingCalc Widget</title>
  <link rel="canonical" href="https://www.meetingcalc.com/embed/">
  <link rel="icon" href="https://www.meetingcalc.com/assets/images/icon48.png" sizes="48x48">
  <style>
    :root {
      --primary: #3366cc; --primary-dark: #2952a3; --secondary: #f8f9fa;
      --text: #1f2937; --light-text: #4b5563; --border: #dee2e6; --surface: #ffffff;
    }
    /* Auto dark mode (used when theme=auto) */
    @media (prefers-color-scheme: dark) {
      html:not(.theme-light):not(.theme-dark) {
        --primary: #6b9aff; --primary-dark: #4f7fe6; --secondary: #1f2937;
        --text: #f3f4f6; --light-text: #d1d5db; --border: #374151; --surface: #111827;
      }
      html:not(.theme-light):not(.theme-dark) body { background-color: #0b1220; }
    }
    /* Forced dark via theme=dark */
    html.theme-dark {
      --primary: #6b9aff; --primary-dark: #4f7fe6; --secondary: #1f2937;
      --text: #f3f4f6; --light-text: #d1d5db; --border: #374151; --surface: #111827;
    }
    html.theme-dark body { background-color: #0b1220; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { color: var(--text); background-color: var(--surface); padding: 0.75rem; }
    .widget {
      max-width: 480px; margin: 0 auto;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 1.1rem 1.25rem;
    }
    .widget h2 { font-size: 1.05rem; margin-bottom: 0.75rem; color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .field label { display: block; font-size: 0.82rem; margin-bottom: 0.25rem; color: var(--light-text); }
    .field input, .field select {
      width: 100%; padding: 0.5rem; border: 1px solid var(--border);
      border-radius: 4px; font-size: 0.9rem; background-color: var(--surface); color: var(--text);
    }
    .results {
      margin-top: 0.6rem; padding: 0.75rem;
      background-color: var(--surface); border-radius: 6px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    }
    .result { text-align: center; padding: 0.4rem; }
    .result .label { font-size: 0.74rem; color: var(--light-text); }
    .result .value { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
    .footer-link {
      display: block; margin-top: 0.7rem; text-align: center;
      font-size: 0.78rem; color: var(--light-text); text-decoration: none;
    }
    .footer-link strong { color: var(--primary); }
    .footer-link:hover strong { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="widget">
    <h2>Meeting Cost Calculator</h2>
    <div class="row">
      <div class="field">
        <label for="d">Duration (min)</label>
        <input type="number" id="d" min="5" max="480" value="60">
      </div>
      <div class="field">
        <label for="a">Attendees</label>
        <input type="number" id="a" min="1" max="100" value="5">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="r">Hourly rate</label>
        <input type="number" id="r" min="1" max="1000" value="50">
      </div>
      <div class="field">
        <label for="c">Currency</label>
        <select id="c">
          <option value="USD" selected>USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="INR">INR</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="f">Frequency</label>
        <select id="f">
          <option value="1">One-time</option>
          <option value="52" selected>Weekly</option>
          <option value="26">Bi-weekly</option>
          <option value="12">Monthly</option>
          <option value="260">Daily</option>
        </select>
      </div>
      <div class="field">
        <label for="m">Loaded cost</label>
        <select id="m">
          <option value="1">Base salary</option>
          <option value="1.4" selected>+ benefits (1.4×)</option>
          <option value="1.6">+ overhead (1.6×)</option>
        </select>
      </div>
    </div>
    <div class="results" aria-live="polite">
      <div class="result">
        <div class="label">This meeting</div>
        <div class="value" id="cost-single">$350.00</div>
      </div>
      <div class="result">
        <div class="label" id="annual-label">Per year</div>
        <div class="value" id="cost-annual">$18,200.00</div>
      </div>
    </div>
    <a class="footer-link" href="https://www.meetingcalc.com/" target="_blank" rel="noopener">
      Powered by <strong>MeetingCalc</strong> — full calculator, live ticker &amp; export
    </a>
  </div>

  <script>
    // Theme: ?theme=light|dark|auto (default auto)
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'dark') document.documentElement.classList.add('theme-dark');
      else if (t === 'light') document.documentElement.classList.add('theme-light');
    })();

    function fmt(value, currency) {
      try {
        return new Intl.NumberFormat(undefined, {
          style: 'currency', currency,
          maximumFractionDigits: currency === 'JPY' ? 0 : 2
        }).format(value);
      } catch (e) { return '$' + value.toFixed(2); }
    }
    var d = document.getElementById('d'), a = document.getElementById('a'),
        r = document.getElementById('r'), c = document.getElementById('c'),
        f = document.getElementById('f'), m = document.getElementById('m'),
        single = document.getElementById('cost-single'),
        annual = document.getElementById('cost-annual'),
        annualLabel = document.getElementById('annual-label');
    function calc() {
      var dur = (parseInt(d.value) || 0) / 60;
      var att = parseInt(a.value) || 0;
      var rate = parseFloat(r.value) || 0;
      var loaded = parseFloat(m.value) || 1;
      var per = parseInt(f.value) || 1;
      var s = dur * att * rate * loaded;
      single.textContent = fmt(s, c.value);
      annual.textContent = fmt(s * per, c.value);
      annualLabel.textContent = per === 1 ? 'Total cost' : 'Per year';
    }
    [d, a, r, c, f, m].forEach(function (el) { el.addEventListener('input', calc); });
    calc();
  </script>
</body>
</html>
